name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nash-store's Linux keyring backend (linux-native-sync-persistent ->
      # dbus-secret-service -> libdbus-sys) needs the system dbus headers.
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Advisory: formatting drift is reported but does not block the build.
      - name: Formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude nash-desktop --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude nash-desktop
